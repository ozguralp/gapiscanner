[tool.poetry]
name = "gapiscanner"
version = "2.0.0"
description = "Google API Scanner - Tests Google API keys (Gemini, Cloud AI, Maps) for unauthorized access and data exposure"
authors = ["Ozgur Alp <info@ozguralp.com>"]
license = "MIT"
repository = "https://github.com/ozguralp/gapiscanner"
readme = "README.md"
include = [
    {path = "google_api_scanner.py", format = "sdist"},
    {path = "RELEASE_NOTES.md", format = "sdist"},
]

packages = [
    {include = "gapiscanner_core"},
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
requests = ">=2.32.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.12.0"

[tool.poetry.scripts]
gapiscanner = "gapiscanner_core.engine:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    -v
    --strict-markers
    --tb=short
"""
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests"
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning"
]

[tool.coverage.run]
source = ["google_api_scanner", "gapiscanner_core"]
omit = [
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
    "*/site-packages/*",
    "*/dist-packages/*",
    "*/.tox/*",
    "*/.coverage*",
    "*/htmlcov/*",
    "*/conftest.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 65

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
