name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-cov pytest-mock
      - name: Compile
        run: python -m compileall -q gapiscanner_core google_api_scanner.py
      - name: Test
        run: python -m pytest -q
      - name: Package smoke test
        run: |
          python -m pip wheel --no-deps . -w dist
          python -m pip uninstall -y gapiscanner
          python -m pip install --no-index --find-links=dist gapiscanner
      - name: Installed commands outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          gapiscanner --help
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gapiscanner .
      - run: docker run --rm gapiscanner --help
